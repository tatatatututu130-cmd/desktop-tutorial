<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="300" height="400" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="300" height="400" fill="#faeaee"/>
    <circle cx="150" cy="185" r="205" fill="#fdf3e9"/>

    <!-- shoulders / robe -->
    <path d="M40 400 C40 300 90 275 150 275 C210 275 260 300 260 400 Z" fill="#c9a06a"/>
    <path d="M40 400 C40 300 90 275 150 275 C160 275 170 277 179 280 C150 300 120 340 118 400 Z" fill="#b98f56"/>
    <path d="M260 400 C260 300 210 275 150 275 C140 275 130 277 121 280 C150 300 180 340 182 400 Z" fill="#b98f56"/>
    <path d="M118 292 C132 320 168 320 182 292 L172 282 C165 292 135 292 128 282 Z" fill="#3a332c"/>

    <!-- neck -->
    <path d="M128 250 L128 292 C138 302 162 302 172 292 L172 250 Z" fill="#e7b98d"/>
    <path d="M128 270 C138 280 162 280 172 270 L172 285 C162 295 138 295 128 285 Z" fill="#d9a97a"/>

    <!-- head -->
    <ellipse cx="150" cy="188" rx="70" ry="80" fill="#efc49a"/>

    <!-- ears -->
    <ellipse cx="83" cy="195" rx="9" ry="14" fill="#efc49a"/>
    <ellipse cx="217" cy="195" rx="9" ry="14" fill="#efc49a"/>

    <!-- hair back: smooth rounded bob -->
    <path d="M150 96 C200 96 226 138 224 190 C222 228 210 256 194 270 L182 262 C196 240 202 210 198 182 C170 172 130 172 102 182 C98 210 104 240 118 262 L106 270 C90 256 78 228 76 190 C74 138 100 96 150 96 Z" fill="#2f261f"/>

    <!-- face -->
    <ellipse cx="150" cy="196" rx="62" ry="72" fill="#efc49a"/>

    <!-- hair front: smooth side-swept fringe (one soft asymmetric parting) -->
    <path d="M90 165 C87 145 92 122 110 108 C130 93 172 92 196 110 C213 123 218 145 214 168 C210 150 200 134 184 126 C190 144 189 162 180 178 C178 152 166 132 146 124 C152 142 150 162 140 178 C136 154 124 136 106 130 C104 146 100 160 92 172 C90 170 90 168 90 165 Z" fill="#2f261f"/>

    <!-- eyebrows -->
    <path d="M114 182 Q126 176 140 181" stroke="#2f261f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M160 181 Q174 176 186 182" stroke="#2f261f" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <path d="M113 197 Q126 191 140 196" stroke="#3a332c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M160 196 Q174 191 187 197" stroke="#3a332c" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- blush -->
    <ellipse cx="112" cy="220" rx="12" ry="7" fill="#e79a8c" opacity="0.45"/>
    <ellipse cx="188" cy="220" rx="12" ry="7" fill="#e79a8c" opacity="0.45"/>

    <!-- nose -->
    <path d="M148 202 Q145 216 150 220" stroke="#d9a97a" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- mouth: warm smile -->
    <path d="M128 233 Q150 250 172 233" stroke="#a8524a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M131 234 Q150 244 169 234" fill="#c96a5e" opacity="0.85"/>
  </g>
</svg>
